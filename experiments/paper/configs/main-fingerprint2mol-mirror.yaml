# Generated by scripts/build_paper_configs.py; see ../README.md.
data:
  task: fingerprint2graph
  data_dir: src/data/massspecgym
  data_file: src/data/fingerprint2graph/PUBCHEM_32.csv
  split_method: formula
  train_iteration_mode: spectrum
  eval_iteration_mode: spectrum
  spectrum_representation: annotated
  n_nodes_max: 32
  n_peaks_max: 128
  n_tokens_max: 256
  batch_size: 128
  num_workers: 8
  pin_memory: true
  scaffold: false
  remove_invalid_molecules: true
  seed: 0
model:
  graph_decoder_type: node_query
  d_token_input: 512
  d_node_decoder: 512
  n_heads: 8
  encoder_layers: 3
  decoder_layers: 3
  d_token_input_feedforward: 1024
  d_node_decoder_feedforward: 1024
  d_edge_decoder: 512
  dropout: 0.1
  use_collision_energy: true
  collision_energy_max: 100.0
  use_token_positions: true
  coloring_image_encoder_type: resnet18
  image_feature_grid_size: 16
target_encoder:
  target_encoder_type: gnn
  d_node_target: 512
  target_layers: 3
  target_dropout: 0.1
  use_laplacian_pe: true
  laplacian_pe_dim: 8
matcher:
  matcher_type: sinkhorn
  matcher_dim: 128
  sinkhorn_mode: unrolling
  sinkhorn_iterations: 20
  sinkhorn_tolerance: 1.0e-06
  sinkhorn_check_convergence_every: 10
  matcher_epsilon: 3.0e-05
  normalize_matcher_cost: true
solver:
  old_solver_approach: true
  solver_type: mirror
  solver_backend: gpu
  tau: 0.1
  max_iter_inner: 20
  tol_inner: 1.0e-05
  max_iter_outer: 20
  tol_outer: 1.0e-05
objective:
  reconstruction_loss: original
  alpha_presence: 1.0
  alpha_atom: 1.0
  alpha_bond: 0.2
  alpha_adjacency: 0.5
  alpha_marginal: 1.0
  feature_diffusion: true
  alpha_feature_diffusion: 1.0
  exclude_self_loops: false
training:
  learning_rate: 0.0001
  weight_decay: 0.0
  lr_scheduler: warmup_cosine
  lr_warmup_fraction: 0.05
  min_learning_rate: 1.0e-05
  max_epochs: 5
  gradient_clip_val: 1.0
  early_stopping_patience: 5
  early_stopping_min_delta: 0.0
  presence_threshold: 0.5
  accelerator: gpu
  devices: 1
  precision: 32-true
  deterministic: false
  log_every_n_steps: 10
  checkpoint_every: 10000
  limit_train_batches: null
  limit_val_batches: null
  validation_interval_minutes: null
  wandb_mode: disabled
  wandb_project: any2graph-v2
  wandb_entity: null
  run_name: main-fingerprint2mol-mirror
  output_dir: artifacts/paper/main-fingerprint2mol-mirror
  enable_progress_bar: false
  checkpoint_path: null
  enable_timing_metrics: true
  timing_warmup_steps: 20
  timing_interval_steps: 10
