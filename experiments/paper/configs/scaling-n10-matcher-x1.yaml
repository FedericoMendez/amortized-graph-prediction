# Generated by scripts/build_paper_configs.py; see ../README.md.
data:
  task: coloring2graph
  data_dir: src/data/coloring/image_max10
  data_file: src/data/coloring/image_max10/manifest.json
  split_method: formula
  train_iteration_mode: spectrum
  eval_iteration_mode: spectrum
  spectrum_representation: annotated
  n_nodes_max: 10
  n_peaks_max: 128
  n_tokens_max: 256
  batch_size: 1536
  num_workers: 8
  pin_memory: true
  scaffold: false
  remove_invalid_molecules: false
  seed: 0
model:
  graph_decoder_type: node_query
  d_token_input: 128
  d_node_decoder: 256
  n_heads: 4
  encoder_layers: 3
  decoder_layers: 5
  d_token_input_feedforward: 256
  d_node_decoder_feedforward: 512
  d_edge_decoder: 64
  dropout: 0.1
  use_collision_energy: false
  collision_energy_max: 100.0
  use_token_positions: false
  coloring_image_encoder_type: segformer_b1
  image_feature_grid_size: 16
target_encoder:
  target_encoder_type: gnn
  d_node_target: 128
  target_layers: 5
  target_dropout: 0.1
  use_laplacian_pe: true
  laplacian_pe_dim: 8
matcher:
  matcher_type: sinkhorn
  matcher_dim: 256
  sinkhorn_mode: unrolling
  sinkhorn_iterations: 20
  sinkhorn_tolerance: 1.0e-06
  sinkhorn_check_convergence_every: 10
  matcher_epsilon: 3.0e-05
  normalize_matcher_cost: true
solver:
  old_solver_approach: false
  solver_type: mirror
  solver_backend: gpu
  tau: 0.1
  max_iter_inner: 20
  tol_inner: 1.0e-05
  max_iter_outer: 20
  tol_outer: 1.0e-05
objective:
  reconstruction_loss: original
  alpha_presence: 1.0
  alpha_atom: 1.0
  alpha_bond: 0.2
  alpha_adjacency: 0.5
  alpha_marginal: 1.0
  feature_diffusion: false
  alpha_feature_diffusion: 1.0
  exclude_self_loops: false
training:
  learning_rate: 0.0001
  weight_decay: 0.0
  lr_scheduler: warmup_cosine
  lr_warmup_fraction: 0.05
  min_learning_rate: 1.0e-05
  max_epochs: 120
  gradient_clip_val: 0.1
  early_stopping_patience: 120
  early_stopping_min_delta: 0.0
  presence_threshold: 0.5
  accelerator: gpu
  devices: 1
  precision: 32-true
  deterministic: false
  log_every_n_steps: 10
  checkpoint_every: 10000
  limit_train_batches: null
  limit_val_batches: null
  validation_interval_minutes: null
  wandb_mode: disabled
  wandb_project: any2graph-v2
  wandb_entity: null
  run_name: scaling-n10-matcher-x1
  output_dir: artifacts/paper/scaling-n10-matcher-x1
  enable_progress_bar: false
  checkpoint_path: null
  enable_timing_metrics: true
  timing_warmup_steps: 20
  timing_interval_steps: 10
